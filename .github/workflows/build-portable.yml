      #     $tag = 'portable-' + (Get-Date -Format 'yyyyMMdd-HHmm')
      #     gh release create $tag dist-exe/*.exe `
      #       --title "便携版 $tag" `
      #       --notes "由 GitHub Actions 自动构建，基于上游 ${{ inputs.upstream_ref || 'main' }}" `
      #       --prerelease
