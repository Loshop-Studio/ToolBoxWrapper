name: Build portable single-file exe

# 触发方式：
#   1. 手动（Actions 页面 → Run workflow，可指定上游分支/标签）
#   2. 推送（改动了壳或脚本时自动验证）
#   3. 定时（每天 02:00 UTC = 北京 10:00 检查上游是否有更新）
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游分支或标签（默认 main）'
        required: false
        default: 'main'
  push:
    branches: [main]
    paths:
      - 'native-windows/**'
      - 'tools/**'
      - 'vendor/**'
      - '.github/workflows/build-portable.yml'
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # 上游的 electron 依赖对本次构建无用，跳过它的二进制下载（约 100MB）
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: 取出本仓库（壳）
        uses: actions/checkout@v4
        with:
          path: shell

      - name: 取出上游仓库（前端）
        uses: actions/checkout@v4
        with:
          repository: Loshop-Studio/ZhongYuToolBox_Web
          ref: ${{ inputs.upstream_ref || 'main' }}
          path: upstream

      - name: 记录上游版本
        shell: pwsh
        working-directory: upstream
        run: |
          $sha = git rev-parse --short HEAD
          $msg = git log -1 --pretty=%s
          "上游提交：$sha  $msg" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装上游依赖
        working-directory: upstream
        # 上游 package-lock.json 里 mp4-muxer 的 tarball 地址被写成了淘宝镜像
        # (registry.npmmirror.com)，GitHub 的美国构建机访问国内镜像会直接失败。
        # 这里做两层处理：① 把 lock 里的镜像地址换回官方源（只改 CI 里的临时副本）；
        # ② 再让 npm 强制把任何非官方下载地址换成官方源，防止上游以后又写进镜像地址。
        # 末尾的 || npm install 是兜底：万一 npm ci 因 lock 严格校验退出，改用 install 继续。
        shell: bash
        env:
          npm_config_registry: https://registry.npmjs.org
          npm_config_replace_registry_host: always
        run: |
          sed -i 's|registry\.npmmirror\.com|registry.npmjs.org|g' package-lock.json
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: 构建前端（webview2 模式）
        working-directory: upstream
        run: npx vite build --config vite.config.ts --mode webview2

      - name: 校验 C# 编译器与前端产物
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "csc.exe 不存在：$csc" }
          if (-not (Test-Path 'upstream/dist/index.html')) { throw "前端产物缺失：upstream/dist/index.html" }
          "csc: $csc" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: 编译壳 + 组装便携版目录
        working-directory: shell
        run: node tools/build-portable.mjs --dist ../upstream/dist --licenses-from ../upstream/node_modules --out ../out

      - name: 打成单文件 SFX
        working-directory: shell
        run: node tools/pack-sfx.mjs --input ../out --out "../dist-exe/中育工具箱（新版免安装）.exe"

      - name: 汇总产物信息
        shell: pwsh
        run: |
          Get-ChildItem dist-exe/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "产物：$($_.Name)  大小：$([math]::Round($_.Length/1MB,2)) MB" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "SHA256：$hash" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: 上传产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: portable-webview2-exe
          path: dist-exe/*.exe
          if-no-files-found: error

      # ─────────────────────────────────────────────────────────────
      # 可选：自动发布到 Release（想启用就把下面整段的注释去掉）
      # 需要仓库 Settings → Actions → General → Workflow permissions
      # 设为「Read and write permissions」
